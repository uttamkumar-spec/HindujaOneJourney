<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HindujaOneJourney Mockup</title>
<style>
:root{
  --brand:#7a1f2b;--brand-ink:#5a1520;--brand-soft:#f9ecee;
  --blue:#23408e;--blue-soft:#eaf0fc;
  --green:#17633f;--green-soft:#e4f3ea;
  --amber:#7d5300;--amber-soft:#fcf1d8;
  --ink:#1c1d24;--muted:#5b5e6e;--line:#e1e2ea;--bg:#f3f3f6;--card:#fff;
  --radius:12px;--shadow:0 1px 2px rgba(20,20,40,.06),0 4px 14px rgba(20,20,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
a{color:var(--blue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Mockup chrome */
.topbar{position:sticky;top:0;z-index:20;background:#16161d;color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.topbar .name{font-weight:700;letter-spacing:.2px}
.topbar .pill{font-size:12px;background:#f2c14e;color:#3a2a00;border-radius:999px;padding:2px 8px;font-weight:600}
.modes{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.modes button{background:transparent;border:1px solid #3a3a48;color:#d8d8e4;border-radius:8px;padding:6px 12px;cursor:pointer}
.modes button[aria-pressed="true"]{background:#fff;color:#16161d;border-color:#fff;font-weight:600}

/* Portal */
.portal-head{background:#fff;border-bottom:1px solid var(--line)}
.portal-head .in{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px}
.logo{font-weight:800;color:var(--brand);font-size:20px;letter-spacing:-.3px}
.logo small{display:block;font-size:10px;letter-spacing:1.4px;color:var(--muted);font-weight:600}
.portal-head nav{margin-left:auto;display:flex;gap:18px;font-weight:600;font-size:14px}
.portal-head nav span{cursor:default}
.page{max-width:1040px;margin:0 auto;padding:24px 16px 64px}
.block{margin-bottom:20px}

.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--blue-soft);color:var(--blue)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px}
.tag.brand{background:var(--brand);color:#fff}.tag.blue{background:var(--blue-soft);color:var(--blue)}.tag.muted{background:#ececf2;color:var(--muted)}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.step-head{display:flex;flex-direction:column;gap:6px}
.step-head .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.step-head h1{font-size:26px}
.step-head p{margin:0;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.banner{background:var(--green-soft);color:var(--green);border-radius:10px;padding:10px 14px;font-weight:500}
.note{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2,.grid4{grid-template-columns:1fr}.step-head h1{font-size:22px}.portal-head nav{display:none}}

.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-ink)}
.btn.secondary{background:var(--blue)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cta-row{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;padding:0}

/* Form */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.field{display:flex;flex-direction:column;gap:5px}
.field .lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=number],.field select,.input{border:1px solid #cfd1dc;border-radius:8px;padding:9px 11px;background:#fff;width:100%}
.field.pre input,.field.pre select{background:#f2faf5;border-color:#a9d6bb}
.field .help{font-size:12px;color:var(--muted)}
.field .err{font-size:12px;color:#b3261e;font-weight:600}
.affix{display:flex;align-items:center;gap:6px}
.affix span{color:var(--muted);font-size:14px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0}
.switch input{width:40px;height:22px;appearance:none;background:#c9cbd6;border-radius:999px;position:relative;cursor:pointer;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:21px}

/* Recommendation cards */
.rec{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:#fff}
.rec.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.rec .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rec h3{font-size:18px}
.rec .why{font-size:13px;color:var(--muted)}
.rec .acts{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

.modal-bg{position:fixed;inset:0;background:rgba(15,15,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:820px;width:100%;padding:22px}
.detail{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
@media (max-width:760px){.detail{grid-template-columns:1fr}}
.comp-row{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.comp-row.inc{background:var(--brand-soft);border-color:#ecc9cf}
@media (max-width:760px){.comp-row{grid-template-columns:1fr 1fr}}
.whybox{background:var(--blue-soft);border-radius:12px;padding:14px}
.whybox ul{margin:8px 0 0;padding-left:18px}

/* Customise / review */
.cust{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}
@media (max-width:760px){.cust{grid-template-columns:1fr}}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:6px 0;border-bottom:1px dashed var(--line)}
.lines td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.lines tr.total td{border-bottom:0;font-weight:800;font-size:16px;padding-top:10px}
.rv-row{display:grid;grid-template-columns:100px 120px 1fr 110px 150px;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.rv-row:last-child{border-bottom:0}
.rv-row>span:last-child{justify-content:flex-end}
.rv-row .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:90px}
@media (max-width:760px){.rv-row{grid-template-columns:1fr 1fr}}
.muted{color:var(--muted)}
.members{display:flex;gap:8px;flex-wrap:wrap}
.members label{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.members label.on{background:var(--brand-soft);border-color:#ecc9cf}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.checks input{margin-top:3px}

/* Hero */
.hero{background:var(--brand);color:#fff;border-radius:18px;padding:32px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.hero .eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:700;opacity:.8}
.hero h1{font-size:34px;margin:8px 0}
.hero .how{background:#fff;color:var(--ink);border-radius:14px;padding:18px}
.hero .how ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.hero .how li{display:flex;gap:10px;align-items:flex-start}
.hero .how li b{display:inline-flex;width:24px;height:24px;border-radius:6px;background:var(--brand);color:#fff;align-items:center;justify-content:center;font-size:13px;flex:none}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:22px}.hero h1{font-size:26px}}

.wallet-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #c9cbd6;border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.mockflag{font-size:11px;color:var(--amber);background:var(--amber-soft);border-radius:5px;padding:1px 6px;font-weight:700}

/* Builder */
.bld{max-width:1320px;margin:0 auto;padding:18px 16px 60px}
.bld-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bld-head h1{font-size:22px;margin-right:auto}
.bld-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.bld-tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.bld-tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.cols{display:grid;grid-template-columns:220px 1fr 340px;gap:16px;align-items:start}
.cols.two{grid-template-columns:1fr 380px}
@media (max-width:1000px){.cols,.cols.two{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h3{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}
.palette-item{border:1px dashed #b9bccb;border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fafafd;cursor:grab;font-size:14px;font-weight:600}
.dnd-list{min-height:46px;border-radius:10px;padding:4px}
.dnd-list.over{background:var(--blue-soft)}
.item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px;background:#fff;cursor:grab}
.item.selected{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.item.dropbefore{box-shadow:0 -3px 0 var(--blue)}
.item.off{opacity:.5}
.item .grip{color:#9a9cab;cursor:grab;user-select:none}
.item .grow{flex:1;min-width:0}
.item .sub{font-size:12px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:26px;cursor:pointer;line-height:1;padding:0;flex:none}
.iconbtn:hover{background:#f3f3f8}
.form-grid{display:grid;gap:10px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form-grid input,.form-grid select,.form-grid textarea{border:1px solid #cfd1dc;border-radius:7px;padding:7px 9px;background:#fff;font-weight:400;color:var(--ink)}
.form-grid .inline{flex-direction:row;align-items:center;gap:8px}
.sectionbox{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;background:#fbfbfd}
.sectionbox .sh{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.sectionbox .sh input{font-weight:700;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:6px;flex:1}
.sectionbox .sh input:hover,.sectionbox .sh input:focus{border-color:#cfd1dc;background:#fff}
.rule{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;margin-bottom:10px}
.rule.match{border-color:#a9d6bb}
.cond{display:grid;grid-template-columns:1.4fr 70px 1fr 28px;gap:6px;margin-bottom:6px}
.cond select,.cond input{border:1px solid #cfd1dc;border-radius:7px;padding:6px 8px;background:#fff;min-width:0}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:8px}
.preview{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.preview .scale{pointer-events:none;transform:scale(.62);transform-origin:top left;width:161%;padding:16px}
.prodtable{width:100%;border-collapse:collapse;font-size:13px}
.prodtable th{text-align:left;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
.prodtable td{padding:4px;border-bottom:1px solid var(--line);vertical-align:middle}
.prodtable input,.prodtable select{border:1px solid #cfd1dc;border-radius:6px;padding:5px 6px;width:100%;min-width:60px;background:#fff}
textarea.json{width:100%;min-height:520px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid #cfd1dc;border-radius:10px;padding:12px}
.scroll-x{overflow-x:auto}

/* Integration console */
.ic{max-width:1320px;margin:0 auto;padding:18px 16px 60px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.ic{grid-template-columns:1fr}}
.adapter{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;margin-bottom:12px}
.adapter .hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adapter code,.log code{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.method{font:700 11px ui-monospace,Menlo,monospace;background:#16161d;color:#fff;border-radius:5px;padding:2px 6px}
pre{background:#16161d;color:#e7e7ef;border-radius:10px;padding:12px;overflow:auto;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:6px 0 0;max-height:360px}
details.log{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;padding:8px 12px}
details.log summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ok{color:var(--green);font-weight:700}.bad{color:#b3261e;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ==========================================================================
   HindujaOneJourney — clickable mockup
   - Every screen is rendered from ONE journey config (DEFAULT_CONFIG below).
     The Workflow builder edits that config; production serves it from the
     Spring Boot backend (GET /api/v1/journey-config) instead of localStorage.
   - Every external system is behind an adapter in `Adapters`. Each mock
     adapter documents the backend contract IT implements; swapping a mock
     for a real call does not touch any screen.
   - All rates, policy numbers and sample people here are MOCK data.
   ========================================================================== */

const STORE_KEY = 'hoj.mockup.config.v1';
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = p => p + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
const inr = n => '₹ ' + Math.round(n).toLocaleString('en-IN');

/* ---------------------------------------------------------------- Config */
const DEFAULT_CONFIG = {
  version: 1,
  brand: { name: 'IndusInd', tagline: 'GENERAL INSURANCE' },
  showUnmatched: true,
  tags: {
    Recommended: { tone: 'brand', preselect: true },
    Relevant: { tone: 'blue', preselect: true },
    Optional: { tone: 'muted', preselect: false }
  },
  steps: [
    { id: 'intro', type: 'intro', enabled: true, counted: false, title: 'Guided protection journey', subtitle: 'Profile first • Personalised recommendation • Customisation • Checkout',
      blocks: [ { id: 'b_hero', type: 'hero' }, { id: 'b_cta0', type: 'cta', label: 'Start my protection profile', action: 'next' } ] },
    { id: 'profile', type: 'profile', enabled: true, counted: true, title: 'My Protection Profile', subtitle: 'Tell us about your family and assets',
      blocks: [ { id: 'b_h1', type: 'stepHeader' }, { id: 'b_bn1', type: 'banner', text: 'Confirm the pre-filled details and add anything missing. Employer-sourced fields can be edited.' },
                { id: 'b_pf', type: 'profileForm' }, { id: 'b_cta1', type: 'cta', label: 'Show my recommendations', action: 'next' } ] },
    { id: 'recommend', type: 'recommend', enabled: true, counted: true, title: 'Recommended for your profile', subtitle: 'Recommendations use your confirmed profile. Every card explains why and remains editable.',
      blocks: [ { id: 'b_h2', type: 'stepHeader' }, { id: 'b_rc', type: 'recommendationCards' },
                { id: 'b_n2', type: 'note', text: 'Recommendation does not remove your choice — select or deselect any product.' },
                { id: 'b_cta2', type: 'cta', label: 'Customise selected plans', action: 'next' } ] },
    { id: 'customise', type: 'customise', enabled: true, counted: true, title: 'Customise suggested plans', subtitle: 'The recommendation is pre-filled. Change limits, members, add-ons or remove a product.',
      blocks: [ { id: 'b_h3', type: 'stepHeader' }, { id: 'b_cp', type: 'customisePanel' },
                { id: 'b_n3', type: 'note', text: 'Changes recalculate through approved product and rating systems.' },
                { id: 'b_cta3', type: 'cta', label: 'Review selected plans', action: 'next' } ] },
    { id: 'review', type: 'review', enabled: true, counted: true, title: 'Review & Checkout', subtitle: 'Buy one product or several. No recommendation is forced.',
      blocks: [ { id: 'b_h4', type: 'stepHeader' }, { id: 'b_rv', type: 'reviewList' }, { id: 'b_ps', type: 'paymentSummary' },
                { id: 'b_cta4', type: 'cta', label: 'Proceed to KYC', action: 'next' } ] },
    { id: 'checkout', type: 'checkout', enabled: true, counted: false, chip: 'Final step', title: 'Secure Checkout', subtitle: 'Confirm your details and consents.',
      blocks: [ { id: 'b_h5', type: 'stepHeader' }, { id: 'b_kyc', type: 'kycForm' },
                { id: 'b_cs', type: 'consents', items: [ 'I confirm the proposal details', 'I consent to product-specific declarations and communication', 'I understand that each policy is independently issued' ] },
                { id: 'b_ps2', type: 'paymentSummary' }, { id: 'b_cta5', type: 'cta', label: 'Pay securely', action: 'pay' } ] },
    { id: 'done', type: 'done', enabled: true, counted: false, chip: 'Complete', title: 'Payment successful', subtitle: 'Selected policies and documents are available in one place.',
      blocks: [ { id: 'b_h6', type: 'stepHeader' }, { id: 'b_w', type: 'wallet' }, { id: 'b_nba', type: 'nextBestAction' } ] }
  ],
  sections: [
    { id: 'family', title: 'Family', fields: ['emp_name', 'emp_age', 'has_spouse', 'spouse_age', 'children_count', 'child_ages', 'has_parents', 'parent_ages', 'gmc_sum', 'gmc_members', 'personal_cover', 'pincode'] },
    { id: 'assets', title: 'Assets', fields: ['own_2w', 'reg_2w', 'own_4w', 'reg_4w', 'intl_travel', 'trips_per_year', 'own_home', 'property_pincode'] }
  ],
  fields: {
    emp_name: { label: 'Employee name', type: 'text', prefill: 'employee.name', required: true },
    emp_age: { label: 'Your age', type: 'number', suffix: 'years', prefill: 'employee.age', required: true },
    has_spouse: { label: 'Spouse', type: 'toggle', prefill: 'spouse.covered' },
    spouse_age: { label: 'Spouse age', type: 'number', suffix: 'years', prefill: 'spouse.age', showIf: { field: 'has_spouse', op: '==', value: true } },
    children_count: { label: 'Number of children', type: 'number', prefill: 'children.count' },
    child_ages: { label: 'Children ages', type: 'text', prefill: 'children.ages', help: 'Comma separated, e.g. 8, 5', showIf: { field: 'children_count', op: '>', value: 0 } },
    has_parents: { label: 'Parents', type: 'toggle', prefill: 'parents.covered' },
    parent_ages: { label: 'Parent ages', type: 'text', help: 'Comma separated', showIf: { field: 'has_parents', op: '==', value: true } },
    gmc_sum: { label: 'Corporate GMC cover', type: 'number', prefix: '₹', suffix: 'lakh', prefill: 'gmc.sumInsuredLakh' },
    gmc_members: { label: 'GMC members', type: 'text', prefill: 'gmc.members' },
    personal_cover: { label: 'Personal health cover', type: 'select', options: ['None declared', 'Yes, I have one'], prefill: 'personalHealth.status' },
    pincode: { label: 'Residential pincode', type: 'text', prefill: 'address.pincode', required: true },
    own_2w: { label: 'Own a 2-Wheeler', type: 'toggle', prefill: 'vehicles.twoWheeler.owned' },
    reg_2w: { label: '2-Wheeler registration number', type: 'text', prefill: 'vehicles.twoWheeler.reg', showIf: { field: 'own_2w', op: '==', value: true } },
    own_4w: { label: 'Own a 4-Wheeler', type: 'toggle', prefill: 'vehicles.fourWheeler.owned' },
    reg_4w: { label: '4-Wheeler registration number', type: 'text', prefill: 'vehicles.fourWheeler.reg', showIf: { field: 'own_4w', op: '==', value: true } },
    intl_travel: { label: 'International travel', type: 'toggle', prefill: 'travel.international' },
    trips_per_year: { label: 'Typical trips per year', type: 'number', prefill: 'travel.tripsPerYear', showIf: { field: 'intl_travel', op: '==', value: true } },
    own_home: { label: 'Own a home', type: 'toggle', prefill: 'home.owned' },
    property_pincode: { label: 'Property pincode', type: 'text', prefill: 'home.pincode', showIf: { field: 'own_home', op: '==', value: true } }
  },
  catalogue: [
    { id: 'health', code: 'HEALTH', name: 'Health', enabled: true, gstPct: 0, usesMembers: true,

function toXml(name, v, ind = '      ') {
  if (Array.isArray(v)) return v.map(x => toXml(name, x, ind)).join('\n');
  if (v && typeof v === 'object') return `${ind}<rat:${name}>\n${Object.entries(v).map(([k, x]) => toXml(k, x, ind + '  ')).join('\n')}\n${ind}</rat:${name}>`;
  const s = String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return `${ind}<rat:${name}>${s}</rat:${name}>`;
}

${Object.entries(body).map(([k, v]) => toXml(k, v)).join('\n')}

async function callAdapter(key, req) {
  const a = Adapters[key], t0 = performance.now();
  const entry = { id: uid('LOG'), key, title: a.title, method: a.method, path: a.path, at: new Date().toLocaleTimeString(), req, res: null, err: null, ms: 0 };
  S.log.unshift(entry); if (S.log.length > 60) S.log.pop();
  try { entry.res = await a.call(req); return entry.res; }
  catch (e) { entry.err = String(e && e.message || e); throw e; }
  finally { entry.ms = Math.round(performance.now() - t0); if (key === 'rating') entry.soap = a.soap(req, entry.res); if (S.mode === 'console') render(); }
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  return el;
}
const coerce = v => v === true || v === false ? v : v === 'true' ? true : v === 'false' ? false : (v !== '' && v != null && !isNaN(+v)) ? +v : v;
function test(c, ctx) {
  const a = coerce(ctx[c.field]), b = coerce(c.value);
  switch (c.op) { case '==': return a === b; case '!=': return a !== b; case '<': return +a < +b; case '<=': return +a <= +b; case '>': return +a > +b; case '>=': return +a >= +b; }
  return false;
}
const shown = (o, ctx) => !o.showIf || test(o.showIf, ctx);
const tpl = (t, ctx) => String(t || '').replace(/\{(\w+)\}/g, (m, k) => ctx[k] == null || ctx[k] === '' ? '—' : ctx[k] === true ? 'Yes' : ctx[k] === false ? 'No' : ctx[k]);
const ages = s => String(s || '').split(',').map(x => +x.trim()).filter(x => x > 0);
const productById = id => config.catalogue.find(p => p.id === id);
const enabledSteps = () => config.steps.filter(s => s.enabled);

function context() {
  const p = S.profile, nChild = +p.children_count || 0, parents = p.has_parents ? (ages(p.parent_ages).length || 2) : 0;
  return { ...p, family_count: 1 + (p.has_spouse ? 1 : 0) + nChild + parents, vehicle_count: (p.own_2w ? 1 : 0) + (p.own_4w ? 1 : 0) };
}
function familyMembers() {
  const p = S.profile, out = [{ key: 'self', relation: 'Self', label: 'Self', age: +p.emp_age || 0 }];
  if (p.has_spouse) out.push({ key: 'spouse', relation: 'Spouse', label: 'Spouse', age: +p.spouse_age || 0 });
  const ca = ages(p.child_ages); for (let i = 0; i < (+p.children_count || 0); i++) out.push({ key: 'child' + i, relation: 'Child', label: 'Child ' + (i + 1), age: ca[i] || 0 });
  if (p.has_parents) { const pa = ages(p.parent_ages); (pa.length ? pa : [0, 0]).forEach((a, i) => out.push({ key: 'parent' + i, relation: 'Parent', label: 'Parent ' + (i + 1), age: a })); }
  return out;
}

function recommendations() {
  const ctx = context(), out = [], seen = new Set();
  for (const r of config.rules) {
    if (!r.enabled) continue;
    const prod = productById(r.product);
    if (!prod || !prod.enabled || seen.has(prod.id)) continue;
    const res = r.when.map(c => test(c, ctx));
    if (r.when.length && !(r.match === 'any' ? res.some(Boolean) : res.every(Boolean))) continue;
    seen.add(prod.id);
    out.push({ product: prod, tag: r.tag, headline: tpl(r.headline, ctx), reasons: r.reasons.map(x => tpl(x, ctx)), rule: r });
  }
  if (config.showUnmatched) for (const p of config.catalogue) if (p.enabled && !seen.has(p.id))
    out.push({ product: p, tag: 'Optional', headline: 'Available to you', reasons: ['Not triggered by your profile — available if you want it'], rule: null });
  return out;
}
function visibleComps(prod) { const ctx = context(); return prod.components.filter(c => shown(c, ctx)); }
function ensureSelection(rec) {
  const pid = rec.product.id;
  if (S.selection[pid]) return S.selection[pid];
  const comps = {};
  for (const c of rec.product.components) comps[c.id] = { included: !!c.included, si: c.si ? c.si.default : null, opt: c.opt ? c.opt.default : null };
  return (S.selection[pid] = { selected: !!(config.tags[rec.tag] || {}).preselect, comps, members: familyMembers().map(m => m.key) });
}
const selectedProducts = () => recommendations().filter(r => S.selection[r.product.id] && S.selection[r.product.id].selected).map(r => r.product);

/* ----------------------------------------------------------------- Quotes */
function quoteRequest(prod) {
  const sel = S.selection[prod.id], p = S.profile, fam = familyMembers();
  const members = prod.usesMembers ? fam.filter(m => sel.members.includes(m.key)).map(m => ({ relation: m.relation, age: m.age })) : [];
  return {
    productCode: prod.code || prod.id, gstPct: prod.gstPct,
    proposer: { name: p.emp_name, age: +p.emp_age || 0, pincode: p.pincode },
    members, travellers: prod.id === 'travel' ? context().family_count : undefined,
    vehicles: prod.id === 'motor' ? [p.own_2w && { type: '2W', reg: p.reg_2w }, p.own_4w && { type: '4W', reg: p.reg_4w }].filter(Boolean) : undefined,
    covers: visibleComps(prod).filter(c => sel.comps[c.id].included).map(c => ({ code: c.code || c.id, name: c.name, rateKey: c.rate, sumInsured: sel.comps[c.id].si, option: sel.comps[c.id].opt }))
  };
}
const qTimers = {};
function scheduleQuote(prod) {
  const req = quoteRequest(prod), key = JSON.stringify(req);
  if (S.quotes[prod.id] && S.quotes[prod.id].key === key) return;
  if (!req.covers.length) { S.quotes[prod.id] = { key, res: { lines: [], premium: 0, gst: 0, total: 0 } }; return; }
  S.quoting[prod.id] = true;
  clearTimeout(qTimers[prod.id]);
  qTimers[prod.id] = setTimeout(async () => {
    try { const res = await callAdapter('rating', req); if (JSON.stringify(quoteRequest(prod)) === key) S.quotes[prod.id] = { key, res }; }
    catch (e) { S.quotes[prod.id] = { key, err: 'Rating service unavailable — please retry' }; }
    S.quoting[prod.id] = false; render();
  }, 300);
}
function quoteAllSelected() { selectedProducts().forEach(scheduleQuote); }
function totals() {
  let premium = 0, gst = 0, pending = false;
  for (const p of selectedProducts()) { const q = S.quotes[p.id]; if (S.quoting[p.id] || !q || !q.res) { pending = true; continue; } premium += q.res.premium; gst += q.res.gst; }
  return { premium, gst, total: premium + gst, pending };
}

async function goto(stepId) {
  S.stepId = stepId; S.detail = null; S.errors = {};
  const st = currentStep();
  if (['profile', 'recommend', 'customise', 'review', 'checkout'].includes(st.type) && S.profileStatus === 'idle') await loadProfile();
  if (['recommend', 'customise', 'review', 'checkout'].includes(st.type)) { recommendations().forEach(ensureSelection); quoteAllSelected(); }
  render(); window.scrollTo(0, 0);
}
async function loadProfile() {
  S.profileStatus = 'loading'; render();
  try {
    const res = await callAdapter('profile', {});
    for (const [fid, f] of Object.entries(config.fields)) {
      if (f.prefill && res.values[f.prefill] !== undefined) { S.profile[fid] = res.values[f.prefill]; S.prefill[fid] = res.values[f.prefill]; }
      else if (S.profile[fid] === undefined) S.profile[fid] = f.type === 'toggle' ? false : '';
    }
    for (const k of ['pan', 'mobile', 'email', 'address']) S.kyc[k] = res.values['kyc.' + k] || '';
    S.profileStatus = 'ready';
  } catch (e) { S.profileStatus = 'error'; }
}
function validateProfile() {
  const ctx = context(), errs = {};
  for (const sec of config.sections) for (const fid of sec.fields) {
    const f = config.fields[fid];
    if (f && f.required && shown(f, ctx) && (S.profile[fid] === '' || S.profile[fid] == null)) errs[fid] = 'Required';
  }
  S.errors = errs;
  const bad = config.sections.findIndex(sec => sec.fields.some(f => errs[f]));
  if (bad >= 0) S.section = bad;
  return !Object.keys(errs).length;
}
function next() {
  const st = currentStep(), list = enabledSteps(), i = list.indexOf(st);
  if (st.type === 'profile' && !validateProfile()) { render(); return; }
  if ((st.type === 'recommend' || st.type === 'customise') && !selectedProducts().length) { alert('Select at least one product to continue.'); return; }
  if (i < list.length - 1) goto(list[i + 1].id);
}
function prev() { const list = enabledSteps(), i = list.indexOf(currentStep()); if (i > 0) goto(list[i - 1].id); }
async function pay(block) {
  const items = (block && block.items) || [];
  if (items.some((_, i) => !S.consents[i])) { S.payError = 'Please accept all declarations to continue.'; render(); return; }
  const t = totals(); if (t.pending) return;
  S.paying = true; S.payError = ''; render();
  try {
    await callAdapter('kyc', { pan: S.kyc.pan, mobile: S.kyc.mobile, email: S.kyc.email });
    const payRes = await callAdapter('payment', { amount: t.total, currency: 'INR', orderRef: uid('ORD'), products: selectedProducts().map(p => p.code) });
    S.policies = [];
    for (const p of selectedProducts()) {
      const r = await callAdapter('policy', { productCode: p.code, quoteId: S.quotes[p.id].res.quoteId, paymentTxn: payRes.txnId });
      S.policies.push({ product: p, ...r });
    }
    S.paying = false;
    const done = enabledSteps().find(s => s.type === 'done'); if (done) goto(done.id); else render();
  } catch (e) { S.paying = false; S.payError = 'Payment could not be completed (mock error).'; render(); }
}

          h('div', { class: 'note', style: 'margin-top:8px' }, 'Response (backend → UI JSON)'), h('pre', null, l.err || JSON.stringify(l.res, null, 2)),
          l.soap && [h('div', { class: 'note', style: 'margin-top:8px' }, 'Backend → SOAP rating service (ILLUSTRATIVE envelope — real one from WSDL)'), h('pre', null, l.soap.request),
                     l.soap.response && [h('div', { class: 'note', style: 'margin-top:8px' }, 'SOAP response (illustrative)'), h('pre', null, l.soap.response)]]))));
}

/* ----------------------------------------------------------------- Shell */
function render() {
  const y = window.scrollY, app = document.getElementById('app');
  const modeBtn = (m, l) => h('button', { 'aria-pressed': String(S.mode === m), onclick: () => { S.mode = m; render(); window.scrollTo(0, 0); } }, l);
  const view = S.mode === 'builder' ? builderView() : S.mode === 'console' ? consoleView() : journeyView();
  app.replaceChildren(
    h('header', { class: 'topbar' }, h('span', { class: 'name' }, 'HindujaOneJourney'), h('span', { class: 'pill' }, 'MOCKUP · mock data & rates'),
      h('div', { class: 'modes' }, modeBtn('journey', 'Customer journey'), modeBtn('builder', 'Workflow builder'), modeBtn('console', `Integration console${S.log.length ? ' (' + S.log.length + ')' : ''}`),
        h('button', { onclick: () => { Object.assign(S, { stepId: null, section: 0, profile: {}, prefill: {}, profileStatus: 'idle', errors: {}, selection: {}, quotes: {}, quoting: {}, detail: null, kyc: {}, consents: {}, policies: [], payError: '' }); S.mode = 'journey'; goto(enabledSteps()[0] && enabledSteps()[0].id); } }, '↺ Restart journey'))),
    view);
  window.scrollTo(0, y);
}
goto(enabledSteps()[0] && enabledSteps()[0].id);
</script>
